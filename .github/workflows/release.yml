name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      run_id:
        description: Build workflow run ID
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GGUFChat-windows
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" release/GGUFChat-windows.zip --title "$TAG" --notes ""
